<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>異分母分數加減競速賽 4-Player Battle</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', 'Comic Sans MS', sans-serif;
      user-select: none;
      -webkit-touch-callout: none;
    }
   
    body {
      background: repeating-linear-gradient( 45deg, #87CEEB, #87CEEB 20px, #9dd8f0 20px, #9dd8f0 40px );
      color: #333;
      overflow: hidden;
      padding: 1vh 1vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      touch-action: none;
    }

    header {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      padding: 1vh 2vw;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 4px solid #fff;
      box-shadow: 0 4px 0 rgba(0,0,0,0.1);
      margin-bottom: 1vh;
    }
   
    h1 {
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      color: #d81b60;
      text-shadow: 2px 2px 0px #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
   
    .hud {
      font-size: clamp(0.9rem, 1.5vw, 1.2rem);
      background: #fff;
      padding: 4px 15px;
      border-radius: 20px;
      color: #ff9f43;
      font-weight: 900;
      border: 3px solid #ff9f43;
      box-shadow: 0 4px 0 #ff9f43;
    }

    .track-section {
      background: #fff;
      border-radius: 20px;
      padding: 6px;
      border: 4px solid #fff;
      box-shadow: 0 6px 0 rgba(0,0,0,0.15);
      margin-bottom: 1vh;
      position: relative;
      flex: 0 0 22vh;
      display: flex;
    }
   
    canvas#trackCanvas {
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #a4ebf3 0%, #7ed6df 100%);
      border-radius: 12px;
      display: block;
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1vw;
      flex: 1;
      min-height: 0;
    }

    .p-box {
      background: #fff;
      border-radius: 20px;
      padding: 1vh 1vw;
      border: 4px solid #ccc;
      box-shadow: 0 6px 0 #ccc;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
   
    .p-box.p0 { border-color: #ff9ff3; box-shadow: 0 6px 0 #f368e0; background: #fff0f6; }
    .p-box.p1 { border-color: #feca57; box-shadow: 0 6px 0 #ff9f43; background: #fff9e6; }
    .p-box.p2 { border-color: #48dbfb; box-shadow: 0 6px 0 #0abde3; background: #e6fbff; }
    .p-box.p3 { border-color: #1dd1a1; box-shadow: 0 6px 0 #10ac84; background: #e6fffa; }

    .p-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 900;
      font-size: clamp(0.8rem, 1vw, 1rem);
      margin-bottom: 4px;
    }
   
    .p-badge {
      padding: 2px 8px;
      border-radius: 12px;
      color: #fff;
      font-size: 0.8rem;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
    }

    .math-board {
      display: flex;
      flex-direction: column;
      background: #fff;
      padding: 6px;
      border-radius: 12px;
      border: 3px dashed #c8d6e5;
      margin-bottom: 4px;
      gap: 6px;
      overflow-y: auto;
      flex: 1;
      scroll-behavior: smooth;
    }
   
    .math-board::-webkit-scrollbar { width: 6px; }
    .math-board::-webkit-scrollbar-track { background: #f1f2f6; border-radius: 10px; }
    .math-board::-webkit-scrollbar-thumb { background: #c8d6e5; border-radius: 10px; }

    .step-line {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 4px;
      width: 100%;
    }

    .step-line:first-child {
      margin-top: auto;
    }

    .num-txt {
      font-size: clamp(0.9rem, 1.2vw, 1.2rem);
      font-weight: 900;
      color: #5f27cd;
      margin: 0 2px;
      display: inline-flex;
      align-items: center;
    }

    .fraction {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      line-height: 1.1;
      margin: 0 4px;
    }
   
    .fraction-num {
      border-bottom: 2px solid currentColor;
      padding: 0 4px;
      min-width: 1em;
      text-align: center;
    }
   
    .fraction-den {
      padding: 0 4px;
      min-width: 1em;
      text-align: center;
    }

    .op-btn {
      font-size: clamp(0.9rem, 1.2vw, 1.2rem);

      color: #5f27cd;
      background: #f1f2f6;
      border: 2px dashed #a4b0be;
      border-radius: 8px;
      padding: 2px 6px;
      cursor: pointer;
      box-shadow: 0 3px 0 #c8d6e5;
      margin: 0 2px;
      transition: 0.1s;
    }
    .op-btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #c8d6e5;
    }

    .m-input-container {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0 4px;
      vertical-align: middle;
      flex-wrap: wrap;
    }
    .m-frac-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .m-box {
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 6px;
      font-weight: 900;
      color: #2d3436;
      cursor: pointer;
      transition: all 0.1s;

    .m-box.active {

      border-color: #0984e3;
      box-shadow: 0 3px 0 #0984e3;
    }

    .blink { animation: blinker 0.8s linear infinite; }
    @keyframes blinker { 50% { border-color: transparent; } }

    .p-feedback {
      min-height: 18px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 900;
      margin-bottom: 4px;
      transition: all 0.2s ease;
      line-height: 1.2;

    .p-feedback.correct { color: #1dd1a1; animation: pop 0.3s ease-out; }
    .p-feedback.wrong { color: #ff6b6b; animation: shake 0.3s ease-out; }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .mini-numpad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-top: auto;
      flex: none;
    }
   
    .m-btn {
      background: #fff;
      color: #576574;
      border: 2px solid #c8d6e5;

      border-radius: 10px;
      cursor: pointer;

      box-shadow: 0 3px 0 #c8d6e5;

    .modal-content {

    .start-btn {

      font-size: 1.2rem;

      padding: 10px 25px;
      border-radius: 30px;

      transition: all 0.1s;
    }
    .start-btn:active { transform: translateY(5px); box-shadow: 0 0px 0 #10ac84; }

  </style>
</head>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
 
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
      osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'click') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(250, audioCtx.currentTime);
      osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
  }

  function gcd(a, b) {
    return b === 0 ? Math.abs(a) : gcd(b, a % b);
  }

  function parseFraction(str) {
    if (!str) return { n: 0, d: 1 };
    let strVal = str.toString();
    let w = 0, n = 0, d = 1;
   
    if (strVal.includes('_')) {
      let parts = strVal.split('_');
      w = parseInt(parts[0]) || 0;
      let fracParts = parts[1].split('/');
      n = parseInt(fracParts[0]) || 0;
      d = parseInt(fracParts[1]) || 1;
    } else if (strVal.includes('/')) {
      let parts = strVal.split('/');
      n = parseInt(parts[0]) || 0;
      d = parseInt(parts[1]) || 1;
    } else {
      w = parseInt(strVal) || 0;
    }
   
    if (d === 0) d = 1;
    let sign = (w < 0 || strVal.trim().startsWith('-')) ? -1 : 1;
    w = Math.abs(w);
    return { n: sign * (w * d + n), d: d };
  }

  function formatFraction(f) {
    let simpl = simplify(f);
    if (simpl.d === 1) return simpl.n.toString();
    if (simpl.n === 0) return "0";
   
    if (Math.abs(simpl.n) > simpl.d) {
      let sign = simpl.n < 0 ? "-" : "";
      let num = Math.abs(simpl.n);
      let w = Math.floor(num / simpl.d);
      let rem = num % simpl.d;
      if (rem === 0) return `${sign}${w}`;
      return `${sign}${w}_${rem}/${simpl.d}`;
    }
    return `${simpl.n}/${simpl.d}`;
  }

  // 輔助函數：將填入的 w, n, d 轉為字串格式
  function buildStr(w, n, d) {
    if (w !== 0 && n !== 0) return `${w}_${n}/${d}`;
    if (w !== 0) return `${w}`;
    if (n !== 0) return `${n}/${d}`;
    return "0";
  }

  function simplify(f) {
    if (f.n === 0) return { n: 0, d: 1 };
    let g = gcd(Math.abs(f.n), Math.abs(f.d));
    let sign = (f.n * f.d < 0) ? -1 : 1;
    return { n: sign * (Math.abs(f.n) / g), d: Math.abs(f.d) / g };
  }

  function addFrac(f1, f2) { return simplify({ n: f1.n * f2.d + f2.n * f1.d, d: f1.d * f2.d }); }
  function subFrac(f1, f2) { return simplify({ n: f1.n * f2.d - f2.n * f1.d, d: f1.d * f2.d }); }

  // 題庫加入大量包含帶分數的計算
  const rawQuestions = [
    "1/2 + 1/3", 
    "3/4 - 1/6", 
    "2/5 + 1/4", 
    "5/8 - 1/2", 
    "5/6 + 1/4", 
    "7/8 - 1/4", 
    "3/5 + 2/3", 
    "9/10 - 1/4", 
    "1_1/2 + 1/3", 
    "2_1/4 + 1_1/3",
    "3_1/2 - 1_1/4",
    "2_1/5 - 1/2", 
    "1_3/4 - 5/6", 
    "3_1/3 - 1_1/2",
    "1/6 + 3/8", 
    "3/4 + 5/6" 
  ];

  const finishDist = 500;
  let gameActive = false;
  let animationFrameId;
  let particles = [];

  const carImg1 = new Image(); carImg1.src = "https://pmath-lab.github.io/decimals4/car1.png";
  const carImg2 = new Image(); carImg2.src = "https://pmath-lab.github.io/decimals4/car2.png";
  const carImg3 = new Image(); carImg3.src = "https://pmath-lab.github.io/decimals4/car3.png";
  const carImg4 = new Image(); carImg4.src = "https://pmath-lab.github.io/decimals4/car4.png";

  let players = [
    { id: 0, name: "兔兔", color: "#ff9ff3", img: carImg1, dist: 0, visualDist: 0, qIdx: 0, yOffset: -25, tokens: [], pastLines: [], stepState: 'SELECT', expectedAns: {n:0,d:1}, leftBound: -1, rightBound: -1, inputData: {}, activeField: 'w', currentOp: '', origA: null, origB: null },
    { id: 1, name: "小熊", color: "#feca57", img: carImg2, dist: 0, visualDist: 0, qIdx: 1, yOffset: -8, tokens: [], pastLines: [], stepState: 'SELECT', expectedAns: {n:0,d:1}, leftBound: -1, rightBound: -1, inputData: {}, activeField: 'w', currentOp: '', origA: null, origB: null },
    { id: 2, name: "貓貓", color: "#48dbfb", img: carImg3, dist: 0, visualDist: 0, qIdx: 2, yOffset: 10, tokens: [], pastLines: [], stepState: 'SELECT', expectedAns: {n:0,d:1}, leftBound: -1, rightBound: -1, inputData: {}, activeField: 'w', currentOp: '', origA: null, origB: null },
    { id: 3, name: "青蛙", color: "#1dd1a1", img: carImg4, dist: 0, visualDist: 0, qIdx: 3, yOffset: 28, tokens: [], pastLines: [], stepState: 'SELECT', expectedAns: {n:0,d:1}, leftBound: -1, rightBound: -1, inputData: {}, activeField: 'w', currentOp: '', origA: null, origB: null }
  ];

  const trackCanvas = document.getElementById('trackCanvas');
  const tCtx = trackCanvas.getContext('2d');

  document.addEventListener('contextmenu', event => event.preventDefault());

  function resizeCanvas() {
    trackCanvas.width = trackCanvas.parentElement.clientWidth - 12;
    trackCanvas.height = trackCanvas.parentElement.clientHeight - 12;
  }
  window.addEventListener('resize', resizeCanvas);

  function getPriorityOpIndex(tokens) {
    let start = 0;
    let end = tokens.length - 1;
    for(let i = start; i <= end; i++) {
      if(tokens[i] === '+' || tokens[i] === '-') return i;
    }
    return -1;
  }

  function startGame() {
    document.getElementById('modal').style.display = 'none';
    particles = [];
    const startOffset = Math.floor(Math.random() * rawQuestions.length);
    players.forEach((p, idx) => {
      p.dist = 0;
      p.visualDist = 0;
      p.qIdx = (startOffset + idx) % rawQuestions.length;
      loadPlayerQuestion(p.id);
    });
   
    gameActive = true;
    resizeCanvas();
    if(animationFrameId) cancelAnimationFrame(animationFrameId);
    gameLoop();
  }

  function loadPlayerQuestion(pId) {
    const p = players[pId];
    p.tokens = rawQuestions[p.qIdx % rawQuestions.length].split(" ");
    p.pastLines = [];
    p.stepState = 'SELECT';
    p.inputData = { w: '', n: '', d: '' };
    p.activeField = 'w';
    document.getElementById(`fb-${pId}`).innerText = "請點選算式中的加減符號👆";
    document.getElementById(`fb-${pId}`).className = "p-feedback";
    renderEquation(pId);
  }

  // 生成通分專用的雙分數輸入框 (加入整數部分支援帶分數)
  function createCommonDenomInput(pId, op) {
    const p = players[pId];
    const container = document.createElement('div');
    container.className = 'm-input-container';

    function makeFrac(prefix) {
      const wrapper = document.createElement('div');
      wrapper.className = 'm-frac-wrapper';

      const wBox = document.createElement('div');
      wBox.className = `m-box m-box-w ${p.activeField === prefix+'w' ? 'active' : ''}`;
      wBox.innerHTML = p.inputData[prefix+'w'] || '<span class="m-placeholder">整</span>';
      wBox.onclick = () => { p.activeField = prefix+'w'; renderEquation(pId); };

      const fracCol = document.createElement('div');
      fracCol.className = 'm-frac-col';

      const nBox = document.createElement('div');
      nBox.className = `m-box m-box-part ${p.activeField === prefix+'n' ? 'active' : ''}`;
      nBox.innerHTML = p.inputData[prefix+'n'] || '<span class="m-placeholder">分子</span>';
      nBox.onclick = () => { p.activeField = prefix+'n'; renderEquation(pId); };

      const line = document.createElement('div');
      line.className = 'm-frac-line';

      const dBox = document.createElement('div');
      dBox.className = `m-box m-box-part ${p.activeField === prefix+'d' ? 'active' : ''}`;
      dBox.innerHTML = p.inputData[prefix+'d'] || '<span class="m-placeholder">分母</span>';
      dBox.onclick = () => { p.activeField = prefix+'d'; renderEquation(pId); };

      fracCol.appendChild(nBox);
      fracCol.appendChild(line);
      fracCol.appendChild(dBox);

      wrapper.appendChild(wBox);
      wrapper.appendChild(fracCol);
      return wrapper;
    }

    container.appendChild(makeFrac('1_'));
   
    let opSpan = document.createElement('span');
    opSpan.className = 'num-txt';
    opSpan.style.margin = '0 8px';
    opSpan.innerText = op;
    container.appendChild(opSpan);

    container.appendChild(makeFrac('2_'));

    return container;
  }

  // 生成最終答案專用的帶分數輸入框
  function createMixedInput(pId) {
    const p = players[pId];
    const container = document.createElement('div');
    container.className = 'm-input-container';

    const wBox = document.createElement('div');
    wBox.className = `m-box m-box-w ${p.activeField === 'w' ? 'active' : ''}`;
    wBox.innerHTML = p.inputData.w || '<span class="m-placeholder">整</span>';
    wBox.onclick = () => { p.activeField = 'w'; renderEquation(pId); };

    const fracCol = document.createElement('div');
    fracCol.className = 'm-frac-col';

    const nBox = document.createElement('div');
    nBox.className = `m-box m-box-part ${p.activeField === 'n' ? 'active' : ''}`;
    nBox.innerHTML = p.inputData.n || '<span class="m-placeholder">分子</span>';
    nBox.onclick = () => { p.activeField = 'n'; renderEquation(pId); };

    const line = document.createElement('div');
    line.className = 'm-frac-line';

    const dBox = document.createElement('div');
    dBox.className = `m-box m-box-part ${p.activeField === 'd' ? 'active' : ''}`;
    dBox.innerHTML = p.inputData.d || '<span class="m-placeholder">分母</span>';
    dBox.onclick = () => { p.activeField = 'd'; renderEquation(pId); };

    fracCol.appendChild(nBox);
    fracCol.appendChild(line);
    fracCol.appendChild(dBox);

    container.appendChild(wBox);
    container.appendChild(fracCol);

    return container;
  }

  function createFractionElement(str) {
    let strVal = str.toString();
    let span = document.createElement('span');
    span.className = 'num-txt';
    span.style.display = 'inline-flex';
    span.style.alignItems = 'center';

    let w = "", n = "", d = "";
    if (strVal.includes('_')) {
      let parts = strVal.split('_');
      w = parts[0];
      let fracParts = parts[1].split('/');
      n = fracParts[0]; d = fracParts[1];
    } else if (strVal.includes('/')) {
      let parts = strVal.split('/');
      n = parts[0]; d = parts[1];
    } else {
      w = strVal;
    }

    if (w) {
      let wSpan = document.createElement('span');
      wSpan.innerText = w;
      if (n) wSpan.style.marginRight = '4px';
      span.appendChild(wSpan);
    }

    if (n && d) {
      let fracDiv = document.createElement('div');
      fracDiv.className = 'fraction';
     
      let numSpan = document.createElement('span');
      numSpan.className = 'fraction-num';
      numSpan.innerText = n;
     
      let denSpan = document.createElement('span');
      denSpan.className = 'fraction-den';
      denSpan.innerText = d;

      fracDiv.appendChild(numSpan);
      fracDiv.appendChild(denSpan);
      span.appendChild(fracDiv);
    }

    if (!w && !n) span.innerText = "0";

    return span;
  }

  function renderToken(token) {
    const ops = ['+', '-', '×', '÷', '(', ')', '='];
    if (ops.includes(token)) {
      let span = document.createElement('span');
      span.className = 'num-txt';
      span.innerText = token;
      return span;
    }
    return createFractionElement(token);
  }

  function renderEquation(pId) {
    const p = players[pId];
    const container = document.getElementById(`q-${pId}`);
    container.innerHTML = '';
   
    p.pastLines.forEach((pastTokens, lineIdx) => {
      let lineDiv = document.createElement('div');
      lineDiv.className = 'step-line';
     
      if (lineIdx > 0) lineDiv.appendChild(renderToken('='));
      pastTokens.forEach(t => lineDiv.appendChild(renderToken(t)));
      container.appendChild(lineDiv);
    });
   
    let currentLineDiv = document.createElement('div');
    currentLineDiv.className = 'step-line';
   
    if (p.pastLines.length > 0) currentLineDiv.appendChild(renderToken('='));

    p.tokens.forEach((t, idx) => {
      if (p.stepState === 'SELECT') {
        if (['+', '-', '×', '÷'].includes(t)) {
          let span = document.createElement('span');
          span.className = 'op-btn';
          span.innerText = t;
          span.onclick = () => handleOpClick(pId, idx);
          currentLineDiv.appendChild(span);
        } else {
          currentLineDiv.appendChild(renderToken(t));
        }
      } else if (p.stepState === 'INPUT_FINAL' || p.stepState === 'INPUT_COMMON') {
        if (idx >= p.leftBound && idx <= p.rightBound) {
          if (idx === p.leftBound) {
            if (p.stepState === 'INPUT_COMMON') {
              currentLineDiv.appendChild(createCommonDenomInput(pId, p.currentOp));
            } else {
              currentLineDiv.appendChild(createMixedInput(pId));
            }
          }
        } else {
          currentLineDiv.appendChild(renderToken(t));
        }
      }
    });
   
    container.appendChild(currentLineDiv);
    container.scrollTop = container.scrollHeight;
  }

  function handleOpClick(pId, idx) {
    if (!gameActive) return;
    const p = players[pId];
    if (p.stepState !== 'SELECT') return;

    const correctIdx = getPriorityOpIndex(p.tokens);
   
    if (idx === correctIdx) {
      playSound('click');
      p.pastLines.push([...p.tokens]);
     
      p.leftBound = idx - 1;
      p.rightBound = idx + 1;
     
      let a = parseFraction(p.tokens[p.leftBound]);
      let b = parseFraction(p.tokens[p.rightBound]);
      let op = p.tokens[idx];
     
      if (op === '+') p.expectedAns = addFrac(a, b);
      else if (op === '-') p.expectedAns = subFrac(a, b);
     
      const fb = document.getElementById(`fb-${pId}`);

      // 判斷是否需要通分（分母不同時）
      if (a.d !== b.d) {
        p.stepState = 'INPUT_COMMON';
        p.inputData = { '1_w': '', '1_n': '', '1_d': '', '2_w': '', '2_n': '', '2_d': '' };
        p.activeField = '1_n'; // 預設跳到第一個分子
        p.currentOp = op;
        p.origA = a;
        p.origB = b;
        fb.innerText = "✅ 正確！請擴分找出公分母 👉";
        fb.className = "p-feedback correct";
      } else {
        p.stepState = 'INPUT_FINAL';
        p.inputData = { w: '', n: '', d: '' };
        p.activeField = 'w';
        fb.innerText = "✅ 同分母可以直接計算答案 👉";
        fb.className = "p-feedback correct";
      }
      renderEquation(pId);
     
    } else {
      playSound('wrong');
      const fb = document.getElementById(`fb-${pId}`);
      fb.innerText = "❌ 不對喔，請點選算式中的符號！";
      fb.className = "p-feedback wrong";
      fb.style.animation = 'none';
      fb.offsetHeight;
      fb.style.animation = null;
    }
  }

  function nextField(pId) {
    if (!gameActive) return;
    const p = players[pId];
   
    if (p.stepState === 'INPUT_COMMON') {
      const seq = ['1_w', '1_n', '1_d', '2_w', '2_n', '2_d'];
      let idx = seq.indexOf(p.activeField);
      p.activeField = seq[(idx + 1) % seq.length];
    } else if (p.stepState === 'INPUT_FINAL') {
      const seq = ['w', 'n', 'd'];
      let idx = seq.indexOf(p.activeField);
      p.activeField = seq[(idx + 1) % seq.length];
    } else {
      return;
    }
   
    playSound('click');
    renderEquation(pId);
  }

  function press(pId, key) {
    if (!gameActive) return;
    let p = players[pId];
    if (p.stepState !== 'INPUT_FINAL' && p.stepState !== 'INPUT_COMMON') return;
   
    if (audioCtx.state === 'suspended') audioCtx.resume();
   
    if (key === 'DEL') {
      p.inputData[p.activeField] = p.inputData[p.activeField].slice(0, -1);
    } else if (key === 'CLR') {
      if (p.stepState === 'INPUT_COMMON') {
        p.inputData = { '1_w': '', '1_n': '', '1_d': '', '2_w': '', '2_n': '', '2_d': '' };
        p.activeField = '1_w';
      } else {
        p.inputData = { w: '', n: '', d: '' };
        p.activeField = 'w';
      }
    } else if (p.inputData[p.activeField].length < 3) {
      p.inputData[p.activeField] += key;
    }
    renderEquation(pId);
  }

  function submitAns(pId) {
    if (!gameActive) return;
    let p = players[pId];

    const fb = document.getElementById(`fb-${pId}`);
    fb.style.animation = 'none';
    fb.offsetHeight;
    fb.style.animation = null;

    // 階段 1：驗證通分步驟
    if (p.stepState === 'INPUT_COMMON') {
      let w1 = parseInt(p.inputData['1_w']) || 0;
      let n1 = parseInt(p.inputData['1_n']);
      let d1 = parseInt(p.inputData['1_d']);
      let w2 = parseInt(p.inputData['2_w']) || 0;
      let n2 = parseInt(p.inputData['2_n']);
      let d2 = parseInt(p.inputData['2_d']);

      if (isNaN(n1) || isNaN(d1) || isNaN(n2) || isNaN(d2)) {
        playSound('wrong');
        fb.className = "p-feedback wrong";
        fb.innerText = "❌ 還有格子空著喔！請填滿分子與分母";
        return;
      }

      if (d1 === 0 || d2 === 0) {
        playSound('wrong');
        fb.className = "p-feedback wrong";
        fb.innerText = "❌ 分母不可以是 0 喔！";
        return;
      }

      let val1 = { n: w1 * d1 + n1, d: d1 };
      let val2 = { n: w2 * d2 + n2, d: d2 };

      let isCommon = (d1 === d2);
      let isEq1 = (val1.n * p.origA.d === p.origA.n * val1.d);
      let isEq2 = (val2.n * p.origB.d === p.origB.n * val2.d);

      if (isCommon && isEq1 && isEq2) {
        playSound('correct');
        
        let str1 = buildStr(w1, n1, d1);
        let str2 = buildStr(w2, n2, d2);
        
        let removeCount = p.rightBound - p.leftBound + 1;
        p.tokens.splice(p.leftBound, removeCount, str1, p.currentOp, str2);
        p.pastLines.push([...p.tokens]);
        
        p.stepState = 'INPUT_FINAL';
        p.inputData = { w: '', n: '', d: '' };
        p.activeField = 'w';
        // 在運算符號位置加入答案格
        p.leftBound = p.leftBound; 
        p.rightBound = p.leftBound + 2; 

        fb.className = "p-feedback correct";
        fb.innerText = "🌟 通分成功！請計算答案 👉";
        renderEquation(pId);
      } else {
        playSound('wrong');
        fb.className = "p-feedback wrong";
        if (!isCommon) fb.innerText = "❌ 兩個分母必須相同喔！";
        else if (!isEq1 || !isEq2) fb.innerText = "❌ 擴分算錯了！數值與原來不相等！";
        else fb.innerText = "❌ 數字填寫有誤，請再檢查一次！";
      }
      return;
    }

    // 階段 2：驗證最終答案與步驟化簡
    if (p.stepState === 'INPUT_FINAL') {
      let wStr = p.inputData.w;
      let nStr = p.inputData.n;
      let dStr = p.inputData.d;

      if (!wStr && !nStr && !dStr) return;

      let w = parseInt(wStr) || 0;
      let n = parseInt(nStr) || 0;
      let d = parseInt(dStr) || 0;
     
      if (n > 0 && d === 0) {
        playSound('wrong');
        fb.className = "p-feedback wrong";
        fb.innerText = "❌ 輸入了分子，請記得輸入分母喔！";
        return;
      }
      if (d === 0) d = 1; 

      let userImproper = { n: w * d + n, d: d };
      let userSimpl = simplify(userImproper);
      let expSimpl = simplify(p.expectedAns);

      let isMatch = (userSimpl.n === expSimpl.n && userSimpl.d === expSimpl.d);
      let isSimplified = (n === 0 || gcd(n, d) === 1);
      let isProper = (n === 0 || n < d);

      if (isMatch) {
        if (isSimplified && isProper) {
          // 最終標準答案！衝刺！
          playSound('correct');
          fb.className = "p-feedback correct";
          fb.innerText = "🌟 完美解題！賽車衝刺 +100m";
          p.dist += 100;
          p.qIdx = (p.qIdx + 3) % rawQuestions.length;
         
          let removeCount = p.rightBound - p.leftBound + 1;
          const ansStr = formatFraction(p.expectedAns);
          p.tokens.splice(p.leftBound, removeCount, ansStr);

          renderEquation(pId);
          setTimeout(() => { if(gameActive) loadPlayerQuestion(pId); }, 1500);
         
        } else {
          // 步驟答案（需約分或轉帶分數），不當作錯誤！
          playSound('click');
          fb.className = "p-feedback correct";
          if (!isProper && !isSimplified) fb.innerText = "✅ 算對了！請繼續化為「帶分數」並「約分」👉";
          else if (!isProper) fb.innerText = "✅ 算對了！請繼續化為「帶分數」👉";
          else fb.innerText = "✅ 算對了！請繼續「約分」到最簡👉";

          let userStr = buildStr(w, n, d);
          let removeCount = p.rightBound - p.leftBound + 1;
          
          p.tokens.splice(p.leftBound, removeCount, userStr);
          p.pastLines.push([...p.tokens]);
          
          // 把輸入框範圍縮小為剛才答對的這一格，繼續作答
          p.rightBound = p.leftBound; 
          p.inputData = { w: '', n: '', d: '' };
          p.activeField = 'w';
          
          renderEquation(pId);
        }
      } else {
        // 完全算錯的情況
        playSound('wrong');
        fb.className = "p-feedback wrong";
        fb.innerText = "❌ 算錯囉，請再檢查一次加減計算！";
        p.inputData = { w: '', n: '', d: '' };
        p.activeField = 'w';
        renderEquation(pId);
      }
    }
  }

  function gameLoop() {
    if (!gameActive) return;
    renderTrack();

    let winner = players.find(p => p.visualDist >= finishDist - 2);
    if (winner) {
      gameActive = false;
      const modal = document.getElementById('modal');
      document.getElementById('modal-title').innerText = "🏆 萌爆冠軍誕生！";
      document.getElementById('modal-msg').innerHTML = `<span style="font-size:3rem; display:block; margin:10px 0; text-align:center;">🥇</span><div style="text-align:center;">🎉 恭喜 <b>${winner.name}</b> <br>率先衝過終點線！</div>`;
      modal.style.display = 'flex';
      renderTrack();
      return;
    }

    animationFrameId = requestAnimationFrame(gameLoop);
  }

  function renderTrack() {
    const w = trackCanvas.width;
    const h = trackCanvas.height;
    tCtx.clearRect(0, 0, w, h);

    tCtx.fillStyle = "#c8d6e5";
    tCtx.beginPath();
    tCtx.moveTo(20, 30);
    tCtx.lineTo(w - 20, 30);
    tCtx.lineTo(w, h - 10);
    tCtx.lineTo(0, h - 10);
    tCtx.fill();
   
    tCtx.strokeStyle = "#fff";
    tCtx.lineWidth = 4;
    tCtx.setLineDash([20, 15]);
    tCtx.beginPath();
    tCtx.moveTo(10, h/2 + 10);
    tCtx.lineTo(w-10, h/2 + 10);
    tCtx.stroke();
    tCtx.setLineDash([]);

    const finishX = w - 60;
    for(let r = 0; r < 5; r++) {
      let ySquare = 30 + (r * ((h-40)/5));
      tCtx.fillStyle = (r % 2 === 0) ? "#fff" : "#333";
      tCtx.fillRect(finishX, ySquare, 20, (h-40)/5);
      tCtx.fillStyle = (r % 2 === 0) ? "#333" : "#fff";
      tCtx.fillRect(finishX + 20, ySquare, 20, (h-40)/5);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      let pt = particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.life -= 0.04;
      pt.size += 0.2;  
      if (pt.life <= 0) {
        particles.splice(i, 1);
      } else {
        tCtx.fillStyle = `rgba(255, 255, 255, ${pt.life})`;
        tCtx.beginPath();
        tCtx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        tCtx.fill();
      }
    }

    let sortedPlayers = [...players].sort((a, b) => a.yOffset - b.yOffset);
    const carW = 75;
    const carH = 55;
    const baseCenterY = h / 2 - 10;

    sortedPlayers.forEach((p) => {
      const speed = (p.dist - p.visualDist) * 0.1;
      p.visualDist += speed;

      let progress = p.visualDist / finishDist;
      if(progress > 1) progress = 1;
      const x = 20 + progress * (finishX - carW - 30);
     
      const isDashing = speed > 0.5;
     
      const bounceSpeed = isDashing ? 80 : 150;
      const bounceAmp = isDashing ? 4 : (progress > 0 && progress < 1 ? 2 : 0);
      const bounce = Math.sin(Date.now() / bounceSpeed + p.id * 10) * bounceAmp;
     
      const carY = baseCenterY + p.yOffset + bounce;

      let tilt = 0;
      if (isDashing) {
        tilt = -0.15;
        if (Math.random() < 0.4) {
           particles.push({
             x: x + 10,
             y: carY + carH - 8,
             vx: -Math.random() * 2 - 1,
             vy: Math.random() - 0.5,
             life: 1,
             size: Math.random() * 4 + 3
           });
        }
      }

      const shadowScale = isDashing ? 0.8 : 1;
      tCtx.fillStyle = "rgba(0,0,0,0.2)";
      tCtx.beginPath();
      const shadowY = baseCenterY + p.yOffset + carH - 5;
      tCtx.ellipse(x + carW/2, shadowY, (carW/2 - 5) * shadowScale, 6 * shadowScale, 0, 0, Math.PI*2);
      tCtx.fill();

      const stretchSpeed = isDashing ? 80 : 200;  
      const stretchAmpY = isDashing ? 0.15 : 0.05;
      const stretchAmpX = isDashing ? 0.05 : 0.02;
      const cycle = Date.now() / stretchSpeed + p.id * 10;
     
      const scaleY = 1 + Math.abs(Math.sin(cycle)) * stretchAmpY;
      const scaleX = 1 - Math.abs(Math.sin(cycle)) * stretchAmpX;

      if (p.img && p.img.complete) {
        tCtx.save();
        tCtx.translate(x + carW/2, carY + carH - 5);
        tCtx.rotate(tilt);
        tCtx.scale(scaleX, scaleY);
        tCtx.drawImage(p.img, -carW/2, -(carH - 5), carW, carH);
        tCtx.restore();
      }
    });
  }

  setTimeout(() => { resizeCanvas(); renderTrack(); }, 200);

</script>
